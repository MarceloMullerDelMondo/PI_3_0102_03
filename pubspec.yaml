name: rpg_puc_survival
description: "PUC Survival - RPG de sobrevivência baseado em geolocalização."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_compass: ^0.8.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.3.2

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Geolocalização
  geolocator: ^13.0.2

  # Motor de jogo 2D
  flame: ^1.18.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/start_screen.jpg
    - assets/images/map_screen.jpg
    - assets/images/h15_lab.jpg
    - assets/images/player_sprite.jpg
